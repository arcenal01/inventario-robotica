<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#151a26" />
    <title>Sem conexão | Inventário Robótica</title>
    <!-- Página independente (sem Next.js): o service worker mostra esta quando não há rede
         e a tela pedida nunca foi aberta neste aparelho. Tudo embutido para funcionar offline. -->
    <style>
      body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 16px; box-sizing: border-box;
        background: #151a26; color: #eceef3; font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
      .cartao { max-width: 380px; width: 100%; background: #1b2130; border: 1px solid #2e3647; border-radius: 16px; padding: 28px 24px; text-align: center; }
      .logo { width: 56px; height: 56px; border-radius: 14px; display: block; margin: 0 auto 16px; }
      h1 { font-size: 20px; margin: 0 0 8px; }
      p { color: #aab1c2; font-size: 14px; line-height: 1.5; margin: 0 0 20px; }
      button { width: 100%; height: 44px; border: 0; border-radius: 10px; background: #48c0f0; color: #0f1522; font-size: 15px; font-weight: 600; cursor: pointer; }
      button:active { transform: scale(0.98); }
    </style>
  </head>
  <body>
    <main class="cartao">
      <img class="logo" src="/icones/icone-192.png" alt="" />
      <h1>Sem conexão</h1>
      <p>Esta tela ainda não foi aberta neste aparelho com conexão, então não dá para mostrá-la agora. Quando a internet ou o servidor da sala voltar, toque em tentar de novo.</p>
      <button type="button" onclick="location.reload()">Tentar de novo</button>
    </main>
  </body>
</html>
